name: Standalone release

on:
  pull_request:
    branches: [trunk]
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  package:
    name: Package and verify (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Build and smoke-test the archive
        env:
          TARGET: ${{ matrix.target }}
        run: |
          node tools/package-standalone.mjs "$TARGET" dist
          node tools/verify-standalone.mjs "dist/tau-$TARGET.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: standalone-${{ matrix.target }}
          path: dist/tau-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm the tagged commit is in main
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TAG_COMMIT: ${{ github.sha }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor "$TAG_COMMIT" HEAD
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: release
          pattern: standalone-*
          merge-multiple: true
      - name: Publish the release and checksums
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd release
          assets=(tau-darwin-arm64.tar.gz tau-linux-arm64.tar.gz tau-linux-x64.tar.gz)
          sha256sum "${assets[@]}" > SHA256SUMS
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes "${assets[@]}" SHA256SUMS
