# Render client keymap: the single declarative table shared by the rune client and a future TUI.
# Semantics: grammar.md. Lint rules: grammar.md §15. Cheat sheet is generated from this file.
# Tiers: local (no host effect) · write (host write, no authority) · decide (authority: readback + y).
# Key syntax: <leader> <C-x> <M-x> <S-x> <D-x> (D = Cmd, GUI only) <CR> <Esc> <Tab> <BS>, printable keys otherwise.
# A <D-x> binding is an alias: its command always has a terminal-representable binding too (KL9).
# The placeholder <label> (hint label) appears only in kind = "modal" entries; KL0 accepts it there.

[meta]
schema = 1
leader = "<Space>"                 # ~/.config/nvim lua/options.lua: mapleader = " "
whichkey_delay_ms = 300            # ~/.config/nvim: timeoutlen = 300
layout_unfreeze_ms = 1500          # FC-T02: deferred list changes apply after this idle time
hint_alphabet = "asdfghjkl"
jumplist_size = 100
digest_display = "4.4"             # widened to "8.8" on collision (FC-M19)

[contexts]                         # child = parent; "" = root
global = ""
list = "global"
reader = "global"
review = "reader"
diff = "reader"
evidence = "reader"
decision = "reader"
chat = "reader"
diagram = "reader"
explorer = "list"                  # the list views: Slices, Proposals, Agents (SC-16, SC-08)
slices = "explorer"                # the Slices list only: ␣sf and :filter live here
filter = "slices"                  # the Slices filter float
settings = "reader"                # SC-17 project settings
editor = "global"
prompt = "editor"
composer = "editor"
editbuf = "editor"
picker = "global"
readback = "global"
hint = "global"
handover = ""                      # the K / gk handover float over a list: an overlay with its own key set, nothing else passes (CD-08)

[groups]                           # which-key labels (KL8)
"<leader>" = "leader"
"<leader>a" = "◇ authorize"
"<leader>c" = "chat"
"<leader>d" = "diagnose"
"<leader>f" = "find"
"<leader>h" = "help"
"<leader>m" = "local"
"<leader>o" = "open"
"<leader>r" = "recover"
"<leader>s" = "search"
"<leader>t" = "toggle"
"g" = "goto"
"z" = "view"
"Z" = "close"
"]" = "next"
"[" = "prev"

# Reserved builtin sets: local tier by definition, countable, used by KL2 for prefix checks.
[builtin]
reader_motions = ["j", "k", "h", "l", "w", "b", "e", "0", "$", "gg", "G", "{", "}", "(", ")", "H", "M", "L",
                  "<C-d>", "<C-u>", "<C-f>", "<C-b>", "<C-e>", "<C-y>", "zz", "zt", "zb", "zl", "zh", "n", "N", "*", "#", "/", "?"]
list_motions = ["j", "k", "gg", "G", "<C-d>", "<C-u>", "n", "N", "/", "?"]
editor_normal = ["h", "j", "k", "l", "w", "b", "e", "W", "B", "E", "0", "^", "$", "gg", "G", "f", "t", "F", "T", ";", ",",
                 "d", "c", "y", "dd", "yy", "cc", "D", "C", "x", "p", "P", "J", "u", "<C-r>", ".", "v", "V",
                 "i", "a", "I", "A", "o", "O", "r", "n", "N", "/", "?", "%"]
editor_textobjects = ["iw", "aw", "ip", "ap", "is", "as", "i\"", "a\"", "i(", "a(", "i[", "a[", "i{", "a{", "iq", "aq", "ib", "ab"]
editor_insert = ["<Esc>", "jk", "<C-w>", "<C-u>", "<CR>", "<C-CR>", "<C-t>", "<C-d>", "<C-j>", "<C-k>", "<C-f>", "<C-n>", "<C-p>", "<Tab>", "<BS>"]
hint = ["<Esc>", "a", "s", "d", "f", "g", "h", "j", "k", "l"]      # hint mode: Esc leaves; the hint_alphabet letters are the labels (printed as chips)
pending = ["<Esc>"]                # Esc cancels a pending prefix (the which-key head prints it as a chip)
timeout_ok = ["jk"]                # KL2 single exception (user's insert-mode escape)

